name: build-and-publish-langpacks

on:
  push:
    paths:
      - "locales/**"
      - "scripts/build.py"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build language packs
        run: python scripts/build.py --locales-dir locales --out out

      - name: Publish as GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: langpacks-latest
          name: Language packs (latest)
          body: Auto-built from locales/ — app reads manifest.json first.
          files: out/*
