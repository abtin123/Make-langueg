name: Complete, validate and publish language packs

on:
  push:
    paths:
      - 'assets/local/**'
      - 'source/**'
      - 'tool/l10n/**'
      - 'tests/**'
      - '.github/workflows/build-and-publish-langpacks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translation dependency
        run: python -m pip install --quiet requests

      - name: Complete every locale from the Abtin Maps source
        run: python tool/l10n/complete_languages.py

      - name: Test translator source-value handling
        run: python tests/test_complete_languages.py

      - name: Validate all locale keys and placeholders
        run: python tests/validate_language_pack_contract.py

      - name: Build all 30 ABL packs
        run: python tool/l10n/build_release.py

      - name: Validate generated packs and manifest
        run: python tests/validate_language_pack_contract.py --require-complete

      - name: Publish / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag: langpacks-latest
          name: Language packs (latest)
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
          files: |
            out/lang_*.abl
            out/manifest.json
