name: build-and-publish-language-packs

on:
  push:
    branches: [main]
    paths:
      - 'app_strings_snapshot.dart'
      - 'scripts/**'
      - 'locales/**'
      - '.locale-state/**'
      - 'examples/base_strings.json'
      - '.github/workflows/build-and-publish-langpacks.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "تگ release"
        required: false
        default: "langpacks-latest"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install language-builder dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Extract the complete non-map UI catalog
        run: python scripts/extract_app_strings.py --source app_strings_snapshot.dart --out examples/base_strings.json

      # Translate only new/changed/invalid keys. A locale is never allowed to
      # publish until it contains exactly the same key set as the app catalog.
      - name: Complete changed language strings before publishing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/complete_locales_internal.py \
            --source examples/base_strings.json \
            --locales-dir locales \
            --checkpoints-dir .locale-checkpoints \
            --state-dir .locale-state \
            --report LOCALE_DELTA_REPORT.json

      - name: Validate and build complete language packs
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'langpacks-latest' }}
        run: |
          python tests/validate_language_pack_contract.py --require-complete
          python scripts/build.py \
            --source examples/base_strings.json \
            --locales-dir locales \
            --out out \
            --download-base "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"

      - name: Commit generated locale updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/base_strings.json locales .locale-state LOCALE_DELTA_REPORT.json
          git diff --cached --quiet || git commit -m "chore: sync complete app localization catalog"
          git push origin main

      - name: Publish manifest and packs with replacement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'langpacks-latest' }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Abtin Maps language packs"
          gh release upload "$RELEASE_TAG" out/* --clobber
