name: build-and-publish-language-packs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'locales/**'
      - 'scripts/build.py'
      - 'scripts/language_catalog.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build-and-publish-langpacks.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate existing JSON locales
        run: python tests/validate_language_pack_contract.py --require-complete

      - name: Build language packs from existing JSON only
        run: |
          rm -rf out
          python scripts/build.py \
            --locales-dir locales \
            --out out \
            --download-base "https://github.com/${{ github.repository }}/releases/download/langpacks-latest"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete langpacks-latest --yes --cleanup-tag || true
          gh release create langpacks-latest out/*.abl out/manifest.json \
            --title "Abtin Maps Language Packs" \
            --notes "Language packs built directly from the existing JSON locale files."
