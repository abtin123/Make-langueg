name: Build Translation Packs

on:
  workflow_dispatch:
  push:
    paths:
      - "fa.json"
      - "generate_languages.py"
      - "requirements.txt"
      - ".github/workflows/translations.yml"

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .translation_cache.json
          key: translations-cache-${{ runner.os }}-${{ hashFiles('fa.json') }}
          restore-keys: |
            translations-cache-${{ runner.os }}-

      - name: Build all 28 language packs
        run: |
          python generate_languages.py

      - name: Create archive
        run: |
          cd dist
          zip -r ../AbtinMaps-language-packs.zip .

      - name: Upload language packs
        uses: actions/upload-artifact@v4
        with:
          name: AbtinMaps-language-packs
          path: |
            AbtinMaps-language-packs.zip
            dist/
          if-no-files-found: error
