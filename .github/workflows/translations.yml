name: Build Translation Packs

on:
  workflow_dispatch:
  push:
    paths:
      - "fa.json"
      - "generate_languages.py"
      - "languages.json"
      - "requirements.txt"
      - ".github/workflows/translations.yml"

permissions:
  contents: write

jobs:
  translations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

      - name: Build translation packs
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          python generate_languages.py

      - name: Validate generated files
        run: |
          test -d dist
          test -f dist/manifest.json
          find dist -type f -name "*.abl" | sort

      - name: Create release ZIP
        run: |
          cd dist
          zip -r ../AbtinMaps-translation-packs.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbtinMaps-translation-packs
          path: AbtinMaps-translation-packs.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: translations-${{ github.run_number }}
          name: AbtinMaps Translation Packs ${{ github.run_number }}
          generate_release_notes: true
          files: AbtinMaps-translation-packs.zip
