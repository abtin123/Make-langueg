name: Build 28 AbtinMaps language packs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: tool/l10n/.fast_cache
          key: abtinmaps-fast-manual-${{ runner.os }}-${{ hashFiles('lib/core/localization/app_localizations.dart') }}
          restore-keys: |
            abtinmaps-fast-manual-${{ runner.os }}-

      - name: Build
        env:
          TRANSLATION_BATCH_SIZE: "18"
          LANGPACK_VERSION: "1"
        run: |
          rm -rf tool/l10n/out
          mkdir -p tool/l10n/out
          python tool/l10n/build_fast_release.py

      - name: Validate
        run: |
          python - <<'PY'
          import gzip,json,pathlib
          out=pathlib.Path("tool/l10n/out")
          expected={"ar","cs","da","de","el","es","fi","fr","he","hi","hu","id","it","ja","ko","nl","no","pl","pt","ro","ru","sv","th","tr","uk","ur","vi","zh"}
          packs=list(out.glob("lang_*.abl"))
          assert len(packs)==28
          assert {p.stem[5:] for p in packs}==expected
          m=json.loads((out/"manifest.json").read_text())
          assert m["language_count"]==28
          print("28 packs OK")
          PY

      - name: Package
        run: |
          cd tool/l10n/out
          zip -9 ../AbtinMaps_language_packs_complete.zip lang_*.abl manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: AbtinMaps-language-packs-complete
          path: tool/l10n/AbtinMaps_language_packs_complete.zip
          retention-days: 30
