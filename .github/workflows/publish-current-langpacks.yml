name: Publish current complete language packs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "تگ release"
        required: false
        default: "langpacks-latest"

permissions:
  contents: write

jobs:
  build-and-publish-current-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # این workflow عمداً هیچ snapshot جدیدی استخراج نمی‌کند و هیچ API/AI
      # فراخوانی ندارد. فقط localeهای کاملِ commit‌شده با کاتالوگ مرجع فعلی
      # (۴۳۲ کلید) را کنترل، بسته‌بندی و منتشر می‌کند.
      - name: Validate and build current complete language packs
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'langpacks-latest' }}
        run: |
          python tests/validate_language_pack_contract.py --require-complete
          python scripts/build.py \
            --source examples/base_strings.json \
            --locales-dir locales \
            --out out \
            --download-base "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"

      - name: Publish manifest and packs with replacement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'langpacks-latest' }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Abtin Maps language packs"
          gh release upload "$RELEASE_TAG" out/* --clobber
