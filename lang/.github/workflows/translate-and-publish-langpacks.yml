name: Translate and publish language packs

# Each language is translated in its OWN job (its own runner / IP), a few at a
# time, so the free Google endpoint is not hit from one address in one burst.
# Progress is cached per language; if Google blocks a job, just run again -
# it continues where it stopped and the other languages are still published.

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "google (free) | auto (google, then Claude for leftovers; needs ANTHROPIC_API_KEY) | anthropic"
        required: true
        default: "google"
        type: choice
        options: [google, auto, anthropic]
      languages:
        description: "Comma list of codes (e.g. tr,de,ar) or all"
        required: true
        default: "all"
      force:
        description: "Ignore cache and retranslate everything"
        type: boolean
        default: false
      release_tag:
        description: "GitHub Release tag to publish to"
        required: true
        default: "langpacks-latest"

permissions:
  contents: write

concurrency:
  group: langpacks-publisher
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.p.outputs.langs }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          REQUESTED: ${{ inputs.languages }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from translate_langpacks import LANGUAGES
          req = os.environ["REQUESTED"].strip().lower()
          langs = list(LANGUAGES) if req == "all" else [c.strip() for c in req.split(",") if c.strip()]
          bad = [c for c in langs if c not in LANGUAGES]
          if bad:
              sys.exit(f"unknown language(s): {bad}")
          open(os.environ["GITHUB_OUTPUT"], "a").write("langs=" + json.dumps(langs) + "\n")
          PY

  translate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lang: ${{ fromJSON(needs.plan.outputs.langs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore translation progress
        uses: actions/cache/restore@v4
        with:
          path: .l10n_cache
          key: l10n-${{ inputs.engine }}-${{ matrix.lang }}-${{ hashFiles('source/en.json') }}
          restore-keys: |
            l10n-${{ inputs.engine }}-${{ matrix.lang }}-

      - name: Translate ${{ matrix.lang }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=(--engine "${{ inputs.engine }}" --languages "${{ matrix.lang }}" --out "out/${{ matrix.lang }}")
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          python scripts/translate_langpacks.py "${args[@]}"

      # Saved even when the job failed/was blocked, so a re-run continues.
      - name: Save translation progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .l10n_cache
          key: l10n-${{ inputs.engine }}-${{ matrix.lang }}-${{ hashFiles('source/en.json') }}-${{ github.run_id }}

      - name: Upload pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.lang }}
          path: out/${{ matrix.lang }}
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [plan, translate]
    # publish whatever succeeded, even if some languages were blocked
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          path: packs

      - name: Fetch current manifest
        run: |
          mkdir -p prev
          gh release download "$TAG" --pattern manifest.json --dir prev || echo "No previous manifest."

      - name: Merge and validate
        run: python scripts/merge_release.py --packs packs --previous prev/manifest.json --out release

      - name: Publish to GitHub Release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Language packs" \
              --notes "Auto-generated language packs (lang_<code>.abl + manifest.json)."
          fi
          gh release upload "$TAG" release/lang_*.abl --clobber
          gh release upload "$TAG" release/manifest.json --clobber
