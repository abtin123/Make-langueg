name: Translate and publish language packs

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Translation engine: google (free) or anthropic (needs ANTHROPIC_API_KEY secret)"
        required: true
        default: "google"
        type: choice
        options: [google, anthropic]
      languages:
        description: "Comma list of codes (e.g. tr,de,ar) or all"
        required: true
        default: "all"
      force:
        description: "Ignore cache and retranslate everything"
        type: boolean
        default: false
      release_tag:
        description: "GitHub Release tag (the app downloads from langpacks-latest)"
        required: true
        default: "langpacks-latest"

permissions:
  contents: write

concurrency:
  group: langpacks-publisher
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .l10n_cache
          key: l10n-${{ inputs.engine }}-${{ hashFiles('source/en.json') }}
          restore-keys: |
            l10n-${{ inputs.engine }}-

      # Keep languages that are not rebuilt in this run in the manifest.
      - name: Fetch current manifest
        run: |
          mkdir -p out
          gh release download "$TAG" --pattern manifest.json --dir out || echo "No previous manifest."

      - name: Translate and build packs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=(--engine "${{ inputs.engine }}" --languages "${{ inputs.languages }}")
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          python scripts/translate_langpacks.py "${args[@]}"

      - name: Validate output
        run: |
          python - <<'PY'
          import gzip, json, hashlib
          from pathlib import Path
          m = json.loads(Path("out/manifest.json").read_text(encoding="utf-8"))
          assert m["languages"], "empty manifest"
          for e in m["languages"]:
              f = Path("out") / f"lang_{e['code']}.abl"
              if not f.exists():
                  continue  # language kept from an earlier release
              assert hashlib.sha256(f.read_bytes()).hexdigest() == e["sha256"], f"sha mismatch {f}"
              data = json.loads(gzip.decompress(f.read_bytes()))
              assert len(data) == e["string_count"] > 0, f"bad pack {f}"
          print("OK:", len(m["languages"]), "languages")
          PY

      - name: Publish to GitHub Release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Language packs" \
              --notes "Auto-generated language packs (lang_<code>.abl + manifest.json)."
          fi
          gh release upload "$TAG" out/lang_*.abl out/manifest.json --clobber
