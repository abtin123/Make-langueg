name: Build language packs

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**'
      - '**/fa.json'
      - '**/generate_languages.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install argostranslate

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .translation-cache
          key: translations-${{ runner.os }}-${{ hashFiles('**/fa.json') }}
          restore-keys: |
            translations-${{ runner.os }}-

      - name: Build all language packs
        env:
          TRANSLATION_WORKERS: '18'
          PROVIDER_MAX_ATTEMPTS: '3'
          PROVIDER_INTERVAL: '0.20'
          FREE_TRANSLATION_PROVIDERS: 'google,mymemory,lingva,argos'
          ARGOS_LOCAL: '1'
        run: |
          python generate_languages.py

      - name: Upload language packs
        uses: actions/upload-artifact@v4
        with:
          name: language-packs
          path: |
            **/*.abl
