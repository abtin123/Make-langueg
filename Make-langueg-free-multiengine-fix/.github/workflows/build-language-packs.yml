name: Build language packs

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**'
      - '**/fa.json'
      - '**/generate_languages.py'
      - '.github/workflows/build-language-packs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install optional offline engine
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install argostranslate

      - name: Restore translation cache
        uses: actions/cache/restore@v4
        with:
          path: .translation_cache
          key: translations-${{ runner.os }}-${{ hashFiles('**/fa.json') }}-${{ github.run_id }}
          restore-keys: |
            translations-${{ runner.os }}-${{ hashFiles('**/fa.json') }}-
            translations-${{ runner.os }}-

      - name: Build all language packs
        env:
          TRANSLATION_WORKERS: '18'
          PROVIDER_MAX_ATTEMPTS: '3'
          PROVIDER_INTERVAL: '0.20'
          FREE_TRANSLATION_PROVIDERS: 'google,mymemory,lingva,argos'
          ARGOS_LOCAL: '1'
        run: |
          python generate_languages.py

      - name: Save translation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .translation_cache
          key: translations-${{ runner.os }}-${{ hashFiles('**/fa.json') }}-${{ github.run_id }}

      - name: Upload language packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-packs
          path: output/
          if-no-files-found: warn
